<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DreBoXs</title>
    <meta
      name="description"
      content="DreBoXs (Dream Boxs / Kotak Impian) - Aplikasi manajemen daftar barang impian pribadi"
    />
    <meta property="og:title" content="DreBoXs - Kotak Impian Pribadi" />
    <meta
      property="og:description"
      content="DreBoXs (Dream Boxs / Kotak Impian) - Aplikasi manajemen daftar barang impian pribadi"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="./src/assets/box.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("drebxs_theme");
          var isDark =
            saved === "dark" ||
            (saved !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
            if (document.body) document.body.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.style.colorScheme = "light";
            if (document.body) document.body.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body
    class="bg-white dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased selection:bg-zinc-900 selection:text-white dark:selection:bg-zinc-100 dark:selection:text-zinc-900"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
